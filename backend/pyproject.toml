[project]
name = "splitbill-backend"
version = "0.1.0"
description = "SplitBill shared-expense API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162,<1",
    "uvicorn[standard]>=0.54",
    "sqlalchemy>=2.1,<3",
    "psycopg[binary]>=3.3,<4",
    "alembic>=1.20,<2",
    "pydantic-settings>=2.16,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2",
    "httpx2>=2.16",  # used by FastAPI TestClient (successor of httpx)
    "ruff>=0.17",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, B: bugbear, UP: modern syntax,
# DTZ: timezone-aware datetimes, SIM: simplifications
select = ["E", "F", "I", "B", "UP", "DTZ", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Header() in default arguments is the intended pattern.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Path"]
