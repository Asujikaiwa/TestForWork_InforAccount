# Development database. Start with:  docker compose up -d db
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: splitbill
      POSTGRES_PASSWORD: splitbill  # local development only
      POSTGRES_DB: splitbill
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates splitbill_test for pytest on first start.
      - ./backend/scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitbill -d splitbill"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
